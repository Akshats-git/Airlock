name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # The offline path (tests, corpus, morning) on Linux and macOS. The live desk needs Switch and ran on Ubuntu 24.04.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Tests (Switch- and Codex-dependent ones skip here; they ran locally against switch-core 0.31.0)
        run: uv run pytest -q
      - name: Attack corpus through Airlock with a fully hijacked reader (no Switch, no keys)
        run: |
          uv run airlock eval airlock --reader quiet | tail -3
          uv run airlock eval airlock --reader quiet | grep -q "attacks that did harm: 0/28"
      - name: A normal morning, 30 emails, end to end
        run: |
          uv run airlock eval morning
          uv run airlock eval morning | grep -q "harm: none"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Airlock architecture</title>
<desc id="d">Vendor email lands in the private ap-quarantine room, where the mailroom posts it, a tool-less reader turns it into a record, and customs, the only member of both rooms, lets a validated record cross into the private ap-desk room. There the clerk matches it, people decide exceptions, and treasury, which obeys only the controller, pays on approval cards through a bank that pays only its own beneficiary list. A plain-code postman writes letters to vendors from the records.</desc>
<style>
  .paper{fill:#f6f2e9}.zone{fill:#ece5d5}.zone2{fill:#e3ecdf}.node{fill:#fffdf8;stroke:#1c1b18;stroke-width:1.3}
  .code{fill:#fffdf8;stroke:#1c1b18;stroke-width:1.3;stroke-dasharray:0}
  .model{fill:#fff4e5;stroke:#9a5b13;stroke-width:1.3}.person{fill:#eef3fb;stroke:#2f4f86;stroke-width:1.3}
  .ext{fill:none;stroke:#6f6a5e;stroke-width:1.2;stroke-dasharray:4 3}
  .wall{stroke:#0f766e;stroke-width:5}.arrow{stroke:#1c1b18;stroke-width:1.4;fill:none}
  .sw{fill:#0f766e;font-size:11px;font-weight:600;letter-spacing:.02em}
  .h{fill:#1c1b18;font-size:15px;font-weight:700}.s{fill:#5d584c;font-size:11.5px}
  .z{fill:#6f6a5e;font-size:11px;font-weight:700;letter-spacing:.12em}.lbl{fill:#3a372f;font-size:11px}
  .tip{fill:#1c1b18}
  @media (prefers-color-scheme: dark){
    .paper{fill:#16150f}.zone{fill:#222018}.zone2{fill:#1b2420}.node,.code{fill:#2a2820;stroke:#efe9d9}
    .model{fill:#33281a;stroke:#e0a35a}.person{fill:#1f2838;stroke:#8fb0ec}.ext{stroke:#a39c88}
    .wall{stroke:#3fbfae}.arrow{stroke:#efe9d9}.sw{fill:#4fd1bf}.h{fill:#efe9d9}.s{fill:#b5ae9a}
    .z{fill:#a39c88}.lbl{fill:#d3ccb8}.tip{fill:#efe9d9}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="tip" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="paper" width="960" height="640"/>

<!-- zones -->
<rect class="zone" x="16" y="16" width="318" height="452" rx="10"/>
<text class="z" x="32" y="40">UNTRUSTED · ap-quarantine</text>
<text class="s" x="32" y="56">private room: who is in it is the wall</text>
<rect class="zone2" x="372" y="16" width="572" height="452" rx="10"/>
<text class="z" x="388" y="40">TRUSTED · ap-desk</text>
<text class="s" x="388" y="56">private room: validated records only</text>

<!-- the wall -->
<line class="wall" x1="353" y1="16" x2="353" y2="300"/>
<line class="wall" x1="353" y1="384" x2="353" y2="468"/>
<text class="sw" transform="translate(347 160) rotate(-90)" text-anchor="middle">ROOM MEMBERSHIP · ONLY CUSTOMS IS IN BOTH</text>

<!-- untrusted side -->
<rect class="ext" x="40" y="74" width="270" height="44" rx="8"/>
<text class="h" x="56" y="94">vendor email</text>
<text class="s" x="56" y="110">bodies, HTML, PDF attachments</text>

<rect class="code" x="40" y="146" width="270" height="52" rx="8"/>
<text class="h" x="56" y="168">mailroom</text>
<text class="s" x="56" y="186">plain code · opens PDFs into text</text>

<rect class="model" x="40" y="226" width="270" height="52" rx="8"/>
<text class="h" x="56" y="248">reader</text>
<text class="s" x="56" y="266">a model · no tools, no memory</text>

<path class="arrow" d="M175 118 V146" marker-end="url(#a)"/>
<path class="arrow" d="M175 198 V226" marker-end="url(#a)"/>
<path class="arrow" d="M255 278 V310" marker-end="url(#a)"/>
<text class="lbl" x="247" y="298" text-anchor="end">one JSON record</text>

<!-- customs straddles the wall -->
<rect class="code" x="200" y="310" width="306" height="64" rx="8" stroke-width="2"/>
<text class="h" x="216" y="334">customs</text>
<text class="s" x="216" y="352">plain code · strict schema, drops all free text</text>
<text class="s" x="216" y="366">holds frauds; records callbacks by sender id</text>
<text class="sw" x="44" y="404">EMAIL IS A CLAIM:</text>
<text class="lbl" x="44" y="420">no field can hold a sentence, so no</text>
<text class="lbl" x="44" y="434">instruction reaches an agent with tools</text>

<!-- trusted side -->
<rect class="person" x="400" y="74" width="210" height="52" rx="8"/>
<text class="h" x="416" y="96">AP specialist</text>
<text class="s" x="416" y="114">decides exceptions · phones</text>
<rect class="person" x="734" y="74" width="186" height="52" rx="8"/>
<text class="h" x="750" y="96">controller</text>
<text class="s" x="750" y="114">owns treasury</text>

<rect class="node" x="400" y="226" width="190" height="52" rx="8"/>
<text class="h" x="416" y="248">ap-clerk</text>
<text class="s" x="416" y="266">Codex sandbox · ERP</text>
<rect class="node" x="750" y="226" width="170" height="52" rx="8" stroke-width="2"/>
<text class="h" x="766" y="248">treasury</text>
<text class="s" x="766" y="266">Claude Code · bank</text>

<path class="arrow" d="M505 126 V226" marker-end="url(#a)"/>
<text class="lbl" x="513" y="180">"short-pay I-0003"</text>
<path class="arrow" d="M460 310 V278" marker-end="url(#a)"/>
<text class="lbl" x="470" y="300">card: values only</text>
<path class="arrow" d="M590 252 H750" marker-end="url(#a)"/>
<text class="sw" x="600" y="243">BATCH DOCUMENT</text>
<text class="lbl" x="600" y="270">only the clerk edits it</text>
<path class="arrow" d="M780 126 V226" marker-end="url(#a)"/>
<text class="lbl" x="772" y="172" text-anchor="end">"run batch"</text>
<path class="arrow" d="M850 226 V126" marker-end="url(#a)"/>
<text class="lbl" x="858" y="166">approval</text>
<text class="lbl" x="858" y="180">card</text>

<rect class="code" x="540" y="318" width="180" height="52" rx="8"/>
<text class="h" x="556" y="340">red-team</text>
<text class="s" x="556" y="358">scripted attacker</text>
<path class="arrow" d="M720 344 H790 V278" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text class="lbl" x="728" y="336">refused</text>

<text class="sw" x="400" y="404">OWNER-ONLY ADDRESSING</text>
<text class="lbl" x="400" y="420">treasury obeys the controller;</text>
<text class="lbl" x="400" y="434">Switch refuses everyone else</text>
<text class="sw" x="574" y="404">APPROVAL CARDS</text>
<text class="lbl" x="574" y="420">every payment asks first; only</text>
<text class="lbl" x="574" y="434">the controller's answer counts</text>
<text class="sw" x="746" y="404">DOCUMENT AUTHORSHIP</text>
<text class="lbl" x="746" y="420">no agent can edit ap-policy;</text>
<text class="lbl" x="746" y="434">only the clerk, its batch</text>

<!-- outside: the bank and the postman -->
<text class="z" x="32" y="492">WHAT LEAVES THE DESK</text>
<rect class="node" x="680" y="502" width="240" height="52" rx="8"/>
<text class="h" x="696" y="524">mock bank</text>
<text class="s" x="696" y="542">pays only its own beneficiary list</text>
<path class="arrow" d="M908 278 V502" marker-end="url(#a)"/>
<text class="lbl" x="900" y="486" text-anchor="end">each approved command</text>

<rect class="ext" x="680" y="580" width="240" height="44" rx="8"/>
<text class="h" x="696" y="599">ISO 20022 files</text>
<text class="s" x="696" y="615">pain.001 transfer · pain.002 status</text>
<path class="arrow" d="M800 554 V580" marker-end="url(#a)"/>

<rect class="code" x="372" y="502" width="268" height="52" rx="8"/>
<text class="h" x="388" y="524">postman</text>
<text class="s" x="388" y="542">plain code · letters from the records</text>
<path class="arrow" d="M680 528 H640" marker-end="url(#a)"/>
<rect class="ext" x="40" y="502" width="294" height="52" rx="8"/>
<text class="h" x="56" y="524">vendors</text>
<text class="s" x="56" y="542">remittance, credit notes, bank notices</text>
<path class="arrow" d="M372 528 H334" marker-end="url(#a)"/>
<text class="lbl" x="372" y="576">to the address on the bank's list;</text>
<text class="lbl" x="372" y="590">no agent has a mail channel out</text>
</svg>
